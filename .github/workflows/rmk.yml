name: RMK – przeliczanie faktur

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: rmk-run
  cancel-in-progress: false

jobs:
  rmk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalacja zależności
        run: pip install -r rmk_service/requirements.txt

      - name: Przelicz nowe faktury
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          RMK_ROOT_FOLDER_ID: ${{ secrets.RMK_ROOT_FOLDER_ID }}
        run: python rmk_service/drive_sync.py
